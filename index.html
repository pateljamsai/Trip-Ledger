<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Trip Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: a single ledger column. Header with trip identity, tab row on desktop, bottom tab bar on phones.
   Money is the loudest thing on every screen; green = receives, orange = owes, grey = settled. */
:root {
  --bg: #eef2f1;
  --surface: #ffffff;
  --surface-2: #f4f7f6;
  --ink: #12201e;
  --ink-2: #546662;
  --line: #d5dedb;
  --accent: #0b5d57;
  --accent-ink: #ffffff;
  --accent-soft: #dcefec;
  --gain: #17704a;
  --gain-soft: #ddf1e6;
  --owe: #b4400b;
  --owe-soft: #fce8dc;
  --danger: #b42318;
  --focus: #1769d1;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1413; --surface: #152120; --surface-2: #1a2827; --ink: #e4eeeb; --ink-2: #9db1ac; --line: #2a3b38;
    --accent: #5cc8bb; --accent-ink: #07201d; --accent-soft: #1a3835; --gain: #55c58d; --gain-soft: #17332a;
    --owe: #f4a070; --owe-soft: #3a2418; --danger: #f28b82; --focus: #7ab3ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1413; --surface: #152120; --surface-2: #1a2827; --ink: #e4eeeb; --ink-2: #9db1ac; --line: #2a3b38;
  --accent: #5cc8bb; --accent-ink: #07201d; --accent-soft: #1a3835; --gain: #55c58d; --gain-soft: #17332a;
  --owe: #f4a070; --owe-soft: #3a2418; --danger: #f28b82; --focus: #7ab3ff; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body { padding-inline: 16px; padding-block: 0; }
.wrap { max-width: 980px; margin-inline: auto; padding-bottom: 96px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 30px; font-weight: 700; }
h2 { font-size: 22px; font-weight: 700; }
h3 { font-size: 17px; font-weight: 650; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }

/* header */
.top { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; justify-content: space-between; padding-block: 20px 14px; }
.top .id { min-width: 0; flex: 1 1 260px; }
.top .meta { color: var(--ink-2); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 2px 12px; }
.top .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tripsel { max-width: 200px; }

/* nav */
.nav { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 20px; overflow-x: auto; }
.nav button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; margin-bottom: -1px; cursor: pointer; font-weight: 550; color: var(--ink-2); white-space: nowrap; }
.nav button:hover { color: var(--ink); }
.nav button[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
.nav .short { display: none; }

/* buttons & fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.danger.solid { background: var(--danger); color: #fff; }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn[disabled] { opacity: 0.55; cursor: not-allowed; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span, .fieldlabel { font-size: 13px; font-weight: 600; color: var(--ink-2); }
input[type=text], input[type=date], input[type=search], input[type=number], select, textarea {
  width: 100%; min-height: 42px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
textarea { min-height: 92px; resize: vertical; }
input::placeholder, textarea::placeholder { color: var(--ink-2); opacity: 0.8; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.end { justify-content: flex-end; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack.tight { gap: 8px; }

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 0; }
.sectionhead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.page { display: flex; flex-direction: column; gap: 20px; }
.banner { border-radius: 10px; padding: 12px 14px; border: 1px solid var(--line); background: var(--surface-2); display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.banner.good { background: var(--gain-soft); border-color: var(--gain); }
.banner.warn { background: var(--owe-soft); border-color: var(--owe); }
.banner.err { background: var(--owe-soft); border-color: var(--danger); color: var(--ink); }
.banner .grow { flex: 1 1 260px; min-width: 0; }
.errs { margin: 0; padding-left: 18px; }

/* hero + stats */
.hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px 32px; align-items: end; }
.hero .big { font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 8vw, 52px); line-height: 1; letter-spacing: -0.02em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.progress { height: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.progress > i { display: block; height: 100%; background: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top: 18px; border-top: 1px solid var(--line); }
.stat { padding: 12px 14px 4px 0; min-width: 0; }
.stat .v { font-family: var(--font-display); font-weight: 650; font-size: 20px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat .s { font-size: 13px; color: var(--ink-2); }

/* tables */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-2); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
th.r, td.r { text-align: right; }
tfoot td { font-weight: 650; border-top: 2px solid var(--line); border-bottom: 0; }
.pos { color: var(--gain); font-weight: 600; }
.neg { color: var(--owe); font-weight: 600; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.pill.gain { background: var(--gain-soft); color: var(--gain); border-color: transparent; }
.pill.owe { background: var(--owe-soft); color: var(--owe); border-color: transparent; }
.faded { opacity: 0.6; }

/* category bars */
.bars { display: flex; flex-direction: column; gap: 12px; }
.bar .top2 { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.bar .track { height: 12px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.bar .track > i { display: block; height: 100%; background: var(--accent); }

/* expense form */
.seg { display: inline-flex; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 8px 14px; cursor: pointer; font-weight: 600; color: var(--ink-2); border-right: 1px solid var(--line); min-height: 40px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.people { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.person { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); min-height: 52px; background: var(--surface); }
.person:last-child { border-bottom: 0; }
.person label { display: flex; gap: 10px; align-items: center; cursor: pointer; min-width: 0; }
.person input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.person .share { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; min-width: 90px; }
.person .cust { display: flex; align-items: center; gap: 6px; }
.person .cust input { width: 110px; text-align: right; min-height: 36px; }
.splitstatus { font-size: 14px; font-weight: 600; }
.splitstatus.bad { color: var(--owe); }
.splitstatus.good { color: var(--gain); }

/* history */
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 10px; }
.exp { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.exp + .exp { margin-top: 10px; }
.exp .head { display: flex; gap: 10px 16px; justify-content: space-between; flex-wrap: wrap; align-items: baseline; }
.exp .head .t { min-width: 0; }
.exp .amt { font-family: var(--font-display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.exp .sub { color: var(--ink-2); font-size: 14px; display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 4px; }
.exp .more { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
.shares { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; margin-top: 8px; }
.shares div { display: flex; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* settle */
.paybox { background: var(--surface-2); }
.checkmark { font-size: 28px; line-height: 1; }

/* reports */
textarea.mono, pre.mono { font-family: var(--font-mono); font-size: 13px; line-height: 1.5; }
pre.mono { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }

/* faq */
.faq details { border-bottom: 1px solid var(--line); }
.faq details:last-child { border-bottom: 0; }
.faq summary { cursor: pointer; font-weight: 600; padding: 14px 4px; }
.faq details > div { padding: 0 4px 16px; color: var(--ink-2); max-width: 68ch; }
.faq details[open] summary { color: var(--accent); }

/* toast */
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; max-width: min(92vw, 420px); z-index: 30; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
#toast[hidden] { display: none; }

footer.note { margin-top: 28px; color: var(--ink-2); font-size: 13px; }

.report h2 { margin-bottom: 4px; }
.report .block { margin-top: 18px; }

@media (max-width: 720px) {
  h1 { font-size: 25px; }
  .hero { grid-template-columns: 1fr; }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; margin: 0; background: var(--surface); border-top: 1px solid var(--line); border-bottom: 0; padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px)); justify-content: space-between; overflow: visible; }
  .nav button { flex: 1 1 0; min-width: 0; padding: 8px 1px; font-size: 11px; border-bottom: 0; border-top: 3px solid transparent; margin: 0; text-align: center; }
  .nav button[aria-current="page"] { border-top-color: var(--accent); }
  .nav .long { display: none; }
  .nav .short { display: inline; }
  .card { padding: 14px; }
  td, th { padding: 9px 7px; }
  #toast { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
}

@media print {
  body { background: #fff; color: #000; padding: 0; }
  .top, .nav, #toast, footer.note, .noprint, .page > *:not(.report-wrap) { display: none !important; }
  .page .report-wrap { display: block !important; }
  .card { border: 0; padding: 0; }
  .wrap { padding-bottom: 0; max-width: none; }
  .pos, .neg { color: #000; }
}
</style>

<script>
/* Trip Ledger calculation engine.
   All money is stored as integers in the smallest currency unit (paise, cents),
   so no floating point arithmetic is ever used for balances or shares. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Engine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var MAX_MINOR = 100000000000; // 1e11 minor units keeps every intermediate product below 2^53
  var STORAGE_KEY = 'tripledger.v1';

  var CURRENCIES = {
    INR: { symbol: '₹', decimals: 2, locale: 'en-IN', name: 'Indian Rupee' },
    USD: { symbol: '$', decimals: 2, locale: 'en-US', name: 'US Dollar' },
    EUR: { symbol: '€', decimals: 2, locale: 'de-DE', name: 'Euro' },
    GBP: { symbol: '£', decimals: 2, locale: 'en-GB', name: 'British Pound' },
    AED: { symbol: 'AED ', decimals: 2, locale: 'en-US', name: 'UAE Dirham' },
    SGD: { symbol: 'S$', decimals: 2, locale: 'en-SG', name: 'Singapore Dollar' },
    THB: { symbol: '฿', decimals: 2, locale: 'th-TH', name: 'Thai Baht' },
    AUD: { symbol: 'A$', decimals: 2, locale: 'en-AU', name: 'Australian Dollar' },
    JPY: { symbol: '¥', decimals: 0, locale: 'ja-JP', name: 'Japanese Yen' }
  };

  var DEFAULT_CATEGORIES = [
    'Fuel and Transportation',
    'Food and Drinks',
    'Hotel and Accommodation',
    'Activities and Entertainment',
    'Shopping',
    'Groceries',
    'Parking and Tolls',
    'Tickets and Bookings',
    'Miscellaneous'
  ];

  /* ---------- parsing ---------- */

  // "1,234.50" -> 123450 (decimals = 2). Returns null if not a valid non-negative amount.
  function parseMoney(input, decimals) {
    if (decimals === undefined) decimals = 2;
    var s = String(input === null || input === undefined ? '' : input).replace(/[,\s]/g, '');
    var re = decimals === 0 ? /^\d+$/ : new RegExp('^(\\d+(\\.\\d{1,' + decimals + '})?|\\.\\d{1,' + decimals + '})$');
    if (!re.test(s)) return null;
    var parts = s.split('.');
    var whole = parts[0] || '0';
    var frac = ((parts[1] || '') + '00000').slice(0, decimals);
    var v = Number(whole) * Math.pow(10, decimals) + (decimals ? Number(frac) : 0);
    if (!Number.isSafeInteger(v) || v > MAX_MINOR) return null;
    return v;
  }

  // "33.33" -> 3333 (hundredths of a percent)
  function parsePercent(input) {
    return parseMoney(input, 2);
  }

  // 123450 -> "1234.50" (plain, for CSV and inputs)
  function toPlain(n, decimals) {
    if (decimals === undefined) decimals = 2;
    var neg = n < 0;
    var a = Math.abs(n);
    var out;
    if (decimals === 0) out = String(a);
    else {
      var s = String(a);
      while (s.length < decimals + 1) s = '0' + s;
      out = s.slice(0, s.length - decimals) + '.' + s.slice(s.length - decimals);
    }
    return (neg ? '-' : '') + out;
  }

  function validDate(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    var p = s.split('-').map(Number);
    var d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    return d.getUTCFullYear() === p[0] && d.getUTCMonth() === p[1] - 1 && d.getUTCDate() === p[2];
  }

  /* ---------- splitting ---------- */

  // Equal split in whole minor units. The leftover units go one each to
  // participants starting at a position rotated by `seed`, so the same person
  // is not always the one who pays the extra paisa.
  function splitEqual(total, ids, seed) {
    var n = ids.length;
    var out = {};
    if (!n) return out;
    var base = Math.floor(total / n);
    var rem = total - base * n;
    ids.forEach(function (id) { out[id] = base; });
    var start = ((seed || 0) % n + n) % n;
    for (var k = 0; k < rem; k++) out[ids[(start + k) % n]] += 1;
    return out;
  }

  // Percentages in hundredths of a percent (10000 = 100%). Largest remainder method.
  function splitPercent(total, bpMap, ids) {
    var out = {};
    var floors = 0;
    var rems = [];
    ids.forEach(function (id, idx) {
      var bp = bpMap[id] || 0;
      var num = total * bp;
      var f = Math.floor(num / 10000);
      out[id] = f;
      floors += f;
      rems.push({ id: id, rem: num - f * 10000, idx: idx });
    });
    var left = total - floors;
    rems.sort(function (a, b) { return b.rem - a.rem || a.idx - b.idx; });
    for (var k = 0; k < left && k < rems.length; k++) out[rems[k].id] += 1;
    return out;
  }

  function sum(obj, ids) {
    var t = 0;
    (ids || Object.keys(obj)).forEach(function (id) { t += obj[id] || 0; });
    return t;
  }

  // Shares for one expense: { memberId: minorUnits }. Assumes the expense is valid.
  function computeShares(e) {
    var ids = e.participants || [];
    if (e.method === 'amount') {
      var o = {};
      ids.forEach(function (id) { o[id] = (e.custom && e.custom[id]) || 0; });
      return o;
    }
    if (e.method === 'percent') return splitPercent(e.amount, e.custom || {}, ids);
    return splitEqual(e.amount, ids, e.seq || 0);
  }

  // Returns a list of human readable problems. Empty list = valid.
  // fmt(minor) formats an amount for messages.
  function validateExpense(e, memberIds, fmt) {
    fmt = fmt || function (n) { return toPlain(n, 2); };
    var errs = [];
    if (!e.desc || !String(e.desc).trim()) errs.push('Add a description, for example "Lunch".');
    var amountOk = Number.isInteger(e.amount) && e.amount > 0;
    if (!amountOk) errs.push('Enter an amount greater than zero.');
    if (!e.payerId || memberIds.indexOf(e.payerId) < 0) errs.push('Choose who paid.');
    var parts = e.participants || [];
    if (!parts.length) errs.push('Select at least one person who shared this expense.');
    else if (parts.some(function (id) { return memberIds.indexOf(id) < 0; })) errs.push('One of the selected people is not in this trip.');
    if (!validDate(e.date)) errs.push('Choose a valid date.');
    if (!e.category || !String(e.category).trim()) errs.push('Choose a category.');
    if (amountOk && parts.length) {
      if (e.method === 'amount') {
        var s = sum(e.custom || {}, parts);
        if (s !== e.amount) {
          var diff = e.amount - s;
          errs.push(diff > 0
            ? 'The shares are ' + fmt(diff) + ' short of the total. They must add up to ' + fmt(e.amount) + '.'
            : 'The shares are ' + fmt(-diff) + ' over the total. They must add up to ' + fmt(e.amount) + '.');
        }
      } else if (e.method === 'percent') {
        var p = sum(e.custom || {}, parts);
        if (p !== 10000) errs.push('The percentages add up to ' + (p / 100) + '%. They must add up to 100%.');
      } else if (e.method !== 'equal') {
        errs.push('Choose how to split this expense.');
      }
    }
    return errs;
  }

  /* ---------- balances ---------- */

  // Separates: original expenses -> member shares -> net balances -> settlement payments -> outstanding.
  function computeBalances(trip) {
    var rows = {};
    var list = [];
    trip.members.forEach(function (m) {
      var r = { id: m.id, paid: 0, share: 0, net: 0, payOut: 0, payIn: 0, outstanding: 0 };
      rows[m.id] = r;
      list.push(r);
    });
    var totalSpent = 0;
    var shareSum = 0;
    (trip.expenses || []).forEach(function (e) {
      totalSpent += e.amount;
      if (rows[e.payerId]) rows[e.payerId].paid += e.amount;
      var sh = computeShares(e);
      Object.keys(sh).forEach(function (id) {
        shareSum += sh[id];
        if (rows[id]) rows[id].share += sh[id];
      });
    });
    var paymentsTotal = 0;
    (trip.payments || []).forEach(function (p) {
      paymentsTotal += p.amount;
      if (rows[p.from]) rows[p.from].payOut += p.amount;
      if (rows[p.to]) rows[p.to].payIn += p.amount;

    var netSum = 0, outSum = 0, originalToSettle = 0, outstandingTotal = 0;
    list.forEach(function (r) {
      r.net = r.paid - r.share;
      r.outstanding = r.net + r.payOut - r.payIn;
      netSum += r.net;
      outSum += r.outstanding;
      if (r.net > 0) originalToSettle += r.net;
      if (r.outstanding > 0) outstandingTotal += r.outstanding;
    });
    var allClear = list.every(function (r) { return r.outstanding === 0; });

      rows: rows,
      list: list,
      totalSpent: totalSpent,
      shareSum: shareSum,
      netSum: netSum,
      outstandingSum: outSum,

  /* ---------- settlement plan ---------- */

  function greedyGroup(items) {

      var pay = Math.min(debtors[i].v, creditors[j].v);
      if (pay > 0) out.push({ from: debtors[i].id, to: creditors[j].id, amount: pay });
      debtors[i].v -= pay;
      creditors[j].v -= pay;
      if (debtors[i].v === 0) i++;
      if (creditors[j].v === 0) j++;

    return out;

  // Fewest possible payments. Splits the people into the largest number of
  // independent groups that already balance among themselves, then settles each
  // group greedily (a group of k people needs at most k-1 payments).
  // Falls back to plain greedy when there are more than 14 people with a balance.
  function planSettlement(outstanding, order) {
    var items = (order || Object.keys(outstanding))
      .filter(function (id) { return outstanding[id]; })
      .map(function (id) { return { id: id, v: outstanding[id] }; });
    var n = items.length;
    if (n === 0) return [];
    if (n > 14) return greedyGroup(items);

    var size = 1 << n;
    var sums = new Array(size);
    sums[0] = 0;
    for (var m = 1; m < size; m++) {
      var low = m & -m;
      var bit = 31 - Math.clz32(low);
      sums[m] = sums[m ^ low] + items[bit].v;
    }
    var dp = new Int8Array(size);
    var best = new Int8Array(size);

      var top = -1, pick = 0;
      for (var b = 0; b < n; b++) {
        if (mask & (1 << b)) {
          var c = dp[mask ^ (1 << b)];
          if (c > top) { top = c; pick = b; }
        }
      }
      dp[mask] = top + (sums[mask] === 0 ? 1 : 0);
      best[mask] = pick;
    }
    var order2 = [];
    var cur = size - 1;
    while (cur) { order2.push(best[cur]); cur ^= 1 << best[cur]; }

    groups.forEach(function (g) {
      // keep member order inside the group so the output is stable

      greedyGroup(g).forEach(function (p) { plan.push(p); });

  function summarize(trip) {

  }

  /* ---------- CSV ---------- */

  function csvCell(v) {

  }

  function expensesCsv(trip) {

      .concat(trip.members.map(function (m) { return 'Share: ' + m.name; }));

    sorted.forEach(function (e) {
      var sh = computeShares(e);
      var row = [
        e.date, e.desc, e.category, nameOf[e.payerId] || '', toPlain(e.amount, d),
        e.method === 'equal' ? 'Equal' : e.method === 'amount' ? 'Custom amounts' : 'Custom percentages',
        (e.participants || []).map(function (id) { return nameOf[id] || ''; }).join('; '),
        e.notes || ''

    });

  }

  /* ---------- storage ---------- */

  function normalizeTrip(t) {
    t.members = Array.isArray(t.members) ? t.members : [];
    t.expenses = Array.isArray(t.expenses) ? t.expenses : [];
    t.payments = Array.isArray(t.payments) ? t.payments : [];

    if (!CURRENCIES[t.currency]) t.currency = 'INR';
    return t;
  }

    try {

      return s;
    } catch (err) { return null; }
  }

    catch (err) { return false; }
  }

  /* ---------- sample data ---------- */

  function sampleTrip() {

    var all = members.map(function (m) { return m.id; });
    function ex(i, desc, cat, amountRupees, payer, date) {

        date: date, participants: all.slice(), method: 'equal', custom: {}, notes: '', createdAt: 0 };
    }
    return normalizeTrip({
      id: 't-sample', sample: true, name: 'Goa Vacation 2026', start: '2026-10-09', end: '2026-10-12',
      location: 'Goa', currency: 'INR', members: members, categories: [],
      expenses: [
        ex(1, 'Fuel', 'Fuel and Transportation', 5000, 'm1', '2026-10-09'),
        ex(2, 'Lunch', 'Food and Drinks', 10000, 'm2', '2026-10-10'),
        ex(3, 'Hotel Stay', 'Hotel and Accommodation', 15000, 'm3', '2026-10-09')
      ],
      payments: [],
      counters: { m: 6, e: 4, p: 1 }
    });
  }

  // The trip a first-time visitor sees: five members, no expenses, every figure at zero.
  function starterTrip() {
    var names = ['Aadhya', 'Ananya', 'Diya', 'Saanvi', 'Kavya'];
    return normalizeTrip({
      id: 't-default', name: 'Having fun', start: '', end: '', location: '', currency: 'INR',
      members: names.map(function (n, i) { return { id: 'm' + (i + 1), name: n, active: true }; }),
      categories: [], expenses: [], payments: [], counters: { m: 6, e: 1, p: 1 }

  }

  // True only for the untouched demo trip that earlier versions saved on first visit.
  function isUntouchedOldSample(t) {
    if (!t || t.id !== 't-sample' || t.name !== 'Goa Vacation 2026') return false;
    if ((t.payments || []).length || (t.expenses || []).length !== 3 || (t.members || []).length !== 5) return false;
    var want = { Fuel: 500000, Lunch: 1000000, 'Hotel Stay': 1500000 };

  }

  return {
    MAX_MINOR: MAX_MINOR, STORAGE_KEY: STORAGE_KEY, CURRENCIES: CURRENCIES, DEFAULT_CATEGORIES: DEFAULT_CATEGORIES,
    parseMoney: parseMoney, parsePercent: parsePercent, toPlain: toPlain, validDate: validDate,
    splitEqual: splitEqual, splitPercent: splitPercent, computeShares: computeShares, validateExpense: validateExpense,
    computeBalances: computeBalances, planSettlement: planSettlement, summarize: summarize,
    expensesCsv: expensesCsv, csvCell: csvCell, normalizeTrip: normalizeTrip, load: load, save: save, sampleTrip: sampleTrip, starterTrip: starterTrip, isUntouchedOldSample: isUntouchedOldSample
  };
});

  var toastTimer = null;

  /* ---------------- shell ---------------- */

      '<div class="stats">' +

      stat('Highest-paying member', X.topPayer ? esc(nameOf(t, X.topPayer.id)) : '—', X.topPayer ? F.money(X.topPayer.paid) + ' paid' : '') +

          '<div class="track" role="img" aria-label="' + esc(c.name) + ' ' + pct + ' percent"><i style="width:' + Math.max(2, Math.round(c.amount / max * 100)) + '%"></i></div></div>';

  function stat(label, value, sub) {

  /* ---------------- add / edit expense ---------------- */

      desc: '', category: ui.lastCategory && categoriesOf(t).indexOf(ui.lastCategory) >= 0 ? ui.lastCategory : E.DEFAULT_CATEGORIES[1],

  function draftFromExpense(t, e, F) {

      custom[id] = e.method === 'percent' ? E.toPlain(e.custom[id], 2).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1') : E.toPlain(e.custom[id], F.decimals);
    });
    return {
      desc: e.desc, category: e.category, amountStr: E.toPlain(e.amount, F.decimals), payerId: e.payerId, date: e.date,

  function viewAdd(t, F) {

    if (d.payerId && ids.indexOf(d.payerId) < 0) d.payerId = '';

    if (!list.length) {
      return '<section class="card stack"><h2>Add members first</h2><p class="muted">An expense needs at least one person on the trip.</p><div><button class="btn primary" data-act="nav" data-view="members">Go to Members</button></div></section>';
    }

      else right = '<span class="cust"><input type="text" inputmode="decimal" id="cust-' + m.id + '" data-cust="' + m.id + '" value="' + esc(d.custom[m.id] || '') + '" aria-label="' + (d.method === 'percent' ? 'Percentage' : 'Amount') + ' for ' + esc(m.name) + '" placeholder="0">' +
        (d.method === 'percent' ? '<span>%</span><span class="share small" data-share="' + m.id + '" style="min-width:74px"></span>' : '') + '</span>';
      return '<div class="person"><label><input type="checkbox" id="part-' + m.id + '" data-part="' + m.id + '"' + (on ? ' checked' : '') + '><span>' + esc(m.name) + (m.active === false ? ' <span class="muted small">(archived)</span>' : '') + '</span></label>' + right + '</div>';
    }).join('');
    var allOn = list.every(function (m) { return d.participants.indexOf(m.id) >= 0; });
    var dup = ui.dup ? '<div class="banner warn" role="alert"><span class="grow"><strong>This looks like a duplicate.</strong> An expense with the same description, amount, payer and date is already recorded.</span><span class="row"><button class="btn sm primary" data-act="save-dup">Save anyway</button><button class="btn sm" data-act="dismiss-dup">Cancel</button></span></div>' : '';
    return '<section class="card"><div class="sectionhead"><h2>' + (editing ? 'Edit expense' : 'Add expense') + '</h2></div>' + errBox(ui.errors) + dup +
      '<form data-form="expense" class="stack" novalidate>' +
      '<div class="grid2"><label class="field"><span>What was it for?</span><input type="text" id="f-desc" data-d="desc" value="' + esc(d.desc) + '" placeholder="Lunch, Fuel, Taxi…" maxlength="80" autocomplete="off"></label>' +
      '<label class="field"><span>Total amount (' + esc(F.symbol) + ')</span><input type="text" id="f-amount" data-d="amountStr" inputmode="decimal" value="' + esc(d.amountStr) + '" placeholder="0" autocomplete="off"></label>' +
      '<label class="field"><span>Paid by</span><select id="f-payer" data-d="payerId"><option value="">Choose who paid…</option>' + list.map(function (m) { return '<option value="' + m.id + '"' + (d.payerId === m.id ? ' selected' : '') + '>' + esc(m.name) + '</option>'; }).join('') + '</select></label>' +
      '<label class="field"><span>Date</span><input type="date" id="f-date" data-d="date" value="' + esc(d.date) + '"></label>' +
      '<div class="field"><label class="fieldlabel" for="f-cat">Category</label><select id="f-cat" data-d="category">' + cats.map(function (c) { return '<option' + (c === d.category ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '<option value="__new">Add a custom category…</option></select></div></div>' +
      (ui.addingCat ? '<div class="row" style="flex-wrap:nowrap"><label class="field" style="flex:1"><span>New category name</span><input type="text" id="newCat" maxlength="40" placeholder="e.g. Boat rides"></label><button class="btn primary" type="button" data-act="save-cat" style="align-self:flex-end">Add category</button><button class="btn" type="button" data-act="cancel-cat" style="align-self:flex-end">Cancel</button></div>' : '') +
      '<div class="stack tight"><div class="row" style="justify-content:space-between"><span class="fieldlabel">Who shared this expense?</span><span class="row"><button class="btn sm" type="button" data-act="' + (allOn ? 'sel-none' : 'sel-all') + '">' + (allOn ? 'Clear all' : 'Select all members') + '</button></span></div>' +
      '<div class="people">' + people + '</div><p id="splitStatus" class="splitstatus" role="status"></p></div>' +
      '<div class="stack tight"><span class="fieldlabel">How to split it</span><div class="seg" role="group" aria-label="Split method">' +
      [['equal', 'Equal'], ['amount', 'By amount'], ['percent', 'By percent']].map(function (x) {
        return '<button type="button" data-act="method" data-v="' + x[0] + '" aria-pressed="' + (d.method === x[0]) + '">' + x[1] + '</button>';
      }).join('') + '</div></div>' +
      '<label class="field"><span>Notes or receipt reference (optional)</span><input type="text" id="f-notes" data-d="notes" value="' + esc(d.notes) + '" maxlength="120" placeholder="Bill no. 1042"></label>' +
      '<div class="row"><button class="btn primary" type="submit" id="saveBtn">' + (editing ? 'Save changes' : 'Add expense') + '</button>' + (editing ? '<button class="btn" type="button" data-act="cancel-edit">Cancel</button>' : '') + '</div></form></section>';
  }

  // Works out the shares that go with the current form values and writes them into the page without re-rendering.
  function refreshPreview() {
    var t = T(); if (!t || !ui.draft) return;
    var d = ui.draft, F = makeFmt(t);
    var status = document.getElementById('splitStatus');
    var shares = {}, msg = '', cls = '';
    var amount = E.parseMoney(d.amountStr, F.decimals);
    var parts = t.members.filter(function (m) { return d.participants.indexOf(m.id) >= 0; }).map(function (m) { return m.id; });
    var seq = ui.editingId ? (t.expenses.filter(function (e) { return e.id === ui.editingId; })[0] || {}).seq : t.counters.e;
    if (!parts.length) { msg = 'Select at least one person.'; cls = 'bad'; }
    else if (d.method === 'equal') {
      if (amount) { shares = E.splitEqual(amount, parts, seq || 0); msg = 'Each pays about ' + F.money(Math.floor(amount / parts.length)) + ' · ' + plural(parts.length, 'person', 'people') + ' sharing'; }
      else msg = 'Enter the amount to see each person’s share.';
    } else if (d.method === 'amount') {
      var s = 0; parts.forEach(function (id) { var v = E.parseMoney(d.custom[id] || '0', F.decimals); s += v || 0; shares[id] = v || 0; });
      if (amount) {
        var diff = amount - s;
        if (diff === 0) { msg = 'Adds up to ' + F.money(amount) + ' ✓'; cls = 'good'; }
        else if (diff > 0) { msg = F.money(diff) + ' left to assign'; cls = 'bad'; }
        else { msg = F.money(-diff) + ' over the total'; cls = 'bad'; }
      } else msg = 'Enter the total amount first.';
      shares = {};
      parts.forEach(function (id) { shares[id] = null; });
    } else {
      var bp = 0; var map = {};
      parts.forEach(function (id) { var v = E.parsePercent(d.custom[id] || '0'); map[id] = v || 0; bp += v || 0; });
      if (bp === 10000) { msg = 'Adds up to 100% ✓'; cls = 'good'; if (amount) shares = E.splitPercent(amount, map, parts); }
      else { var left = 10000 - bp; msg = left > 0 ? (left / 100) + '% left to assign' : (-left / 100) + '% over 100%'; cls = 'bad'; }
    }
    if (status) { status.textContent = msg; status.className = 'splitstatus ' + cls; }
    Array.prototype.forEach.call(document.querySelectorAll('[data-share]'), function (el) {
      var v = shares[el.getAttribute('data-share')];
      el.textContent = v === undefined || v === null ? '' : F.money(v);
    });
  }

  function submitExpense(force) {
    var t = T(), F = makeFmt(t), d = ui.draft;
    var errs = [];
    var amountRaw = E.parseMoney(d.amountStr, F.decimals);
    var parts = t.members.filter(function (m) { return d.participants.indexOf(m.id) >= 0; }).map(function (m) { return m.id; });
    var custom = {};
    if (d.method !== 'equal') {
      parts.forEach(function (id) {
        var s = String(d.custom[id] || '').trim();
        var v = s === '' ? 0 : (d.method === 'percent' ? E.parsePercent(s) : E.parseMoney(s, F.decimals));
        if (v === null) errs.push('Check the ' + (d.method === 'percent' ? 'percentage' : 'amount') + ' for ' + nameOf(t, id) + '. Use numbers only.');
        custom[id] = v || 0;
      });
    }
    var existing = ui.editingId ? t.expenses.filter(function (x) { return x.id === ui.editingId; })[0] : null;
    var e = {
      id: existing ? existing.id : null, seq: existing ? existing.seq : t.counters.e,
      desc: d.desc.trim(), category: d.category, amount: amountRaw === null ? 0 : amountRaw, payerId: d.payerId, date: d.date,
      participants: parts, method: d.method, custom: custom, notes: d.notes.trim(), createdAt: existing ? existing.createdAt : Date.now()
    };
    var found = E.validateExpense(e, memberIds(t), F.money);
    if (amountRaw === null && String(d.amountStr).trim()) {
      found = found.filter(function (m) { return m.indexOf('amount greater than zero') < 0; });
      found.unshift('The amount must be a number such as 1250 or 1250.50.');
    }
    errs = errs.concat(found);
    if (errs.length) { ui.errors = errs; ui.dup = false; render(); window.scrollTo(0, 0); return; }
    if (!existing && !force) {
      var dupe = t.expenses.some(function (x) {
        return x.desc.toLowerCase() === e.desc.toLowerCase() && x.amount === e.amount && x.payerId === e.payerId && x.date === e.date;
      });
      if (dupe) { ui.errors = []; ui.dup = true; render(); window.scrollTo(0, 0); return; }
    }
    ui.errors = []; ui.dup = false;
    if (existing) {
      t.expenses[t.expenses.indexOf(existing)] = e;
      ui.editingId = null; ui.draft = null;
      toast('Changes saved. Balances updated.');
      persist(); go('history'); return;
    }
    e.id = nextId(t, 'e');
    t.expenses.push(e);
    ui.lastPayer = e.payerId; ui.lastCategory = e.category; ui.lastDate = e.date;
    ui.draft = null;
    toast('Added ' + e.desc + ' · ' + F.money(e.amount));
    commit();
    window.scrollTo(0, 0);
  }

      '<label class="field"><span>Person</span><select id="flt-member" data-f="member"><option value="">Anyone</option>' + t.members.map(function (m) { return '<option value="' + m.id + '"' + (f.member === m.id ? ' selected' : '') + '>' + esc(m.name) + '</option>'; }).join('') + '</select></label>' +

      '<div id="histList"></div></section>';
  }
  function filteredExpenses(t) {
    var f = ui.filters, q = f.q.trim().toLowerCase();

  function renderHistoryList() {

  function methodLabel(m) { return m === 'equal' ? 'Equal split' : m === 'amount' ? 'Custom amounts' : 'Custom percentages'; }
  function expenseCard(t, e, F) {

          return '<div><span>' + esc(m.name) + pct + '</span><strong>' + F.money(sh[m.id]) + '</strong></div>';

  /* ---------------- FAQ ---------------- */
  var FAQ = [
    ['How do I add an expense?', 'Open <strong>Add Expense</strong>, say what it was for, enter the total and who paid, tick everyone who shared it, and press <em>Add expense</em>. The last payer, date and category are remembered so entering several expenses in a row takes a few taps each.'],
    ['How is each person’s share worked out?', 'By default the amount is split equally between the people you tick. Each person’s <strong>net balance = total paid − their share</strong>. A positive balance means they should receive money, a negative one means they owe money, and zero means they are settled. Everything updates the moment you add, edit or delete an expense.'],
    ['What if the person who paid did not share the cost?', 'Untick them under “Who shared this expense?”. They still get full credit for what they paid, and they are not given a share of that expense.'],
    ['Can I split an expense unevenly?', 'Yes. Choose <em>By amount</em> to type each person’s share (the shares must add up to the total), or <em>By percent</em> (the percentages must add up to 100%). The page shows how much is still left to assign and will not save until it adds up.'],
    ['What happens when an amount does not divide evenly?', 'Money is worked out in the smallest unit (paise or cents), never in fractions. If 1,000.00 is shared by three people, the shares are 333.34, 333.33 and 333.33. The spare unit moves to a different person on each expense, so shares always add up exactly to the total.'],
    ['How does “Who Owes Whom” choose the payments?', 'It looks for the fewest payments that clear everyone, so nobody has to pay every other person. Total owed always equals total to be received.'],
    ['What does “Mark as paid” do?', 'It records a repayment. It does not change your expense history and is not counted as a trip expense. The original balances stay as they were, and the <em>Still outstanding</em> figure goes down.'],
    ['What if someone paid a different amount than suggested?', 'The amount box opens with the suggestion filled in. Change it to what was actually paid and record it. The plan is recalculated from what is still outstanding. You can also use <em>Record a different payment</em> for a payment that is not in the plan. If someone overpays, the plan shows the difference coming back.'],
    ['I recorded a payment by mistake. Can I fix it?', 'Yes. In <em>Repayments recorded</em>, use <em>Correct</em> to change the amount or <em>Undo</em> to remove it. Balances update straight away.'],
    ['Can I edit or delete an expense?', 'Yes. Open <strong>Expense History</strong>, then use <em>Edit</em> or <em>Delete</em>. Deleting asks you to confirm first. You can also search by description and filter by person, category and date there.'],
    ['Why can’t I remove a member?', 'Someone who has paid for, or shared in, an expense (or has a recorded repayment) is part of the trip’s numbers, so removing them would break the totals. Use <em>Archive</em> instead. They disappear from new expenses but stay in the history and balances, and you can restore them at any time. People with no activity can be removed.'],
    ['Can I rename people or change the trip details?', 'Yes. In <strong>Members</strong>, use <em>Rename</em> on a person, or edit the trip name, dates, location and currency under <em>Trip details</em>. A rename is applied everywhere. Once a trip has expenses, the currency can only be switched to one that uses the same number of decimals.'],
    ['Can I keep more than one trip?', 'Yes. Press <em>New trip</em> at the top. Each trip has its own members, expenses and payments, and the heading at the top shows the name of the trip you are viewing. Use the drop-down next to <em>New trip</em> to switch between them.'],
    ['Where is my data saved? Can others see it?', 'Trips are saved in this browser on this device only. Nothing is uploaded, so other people cannot see your trip and it will not appear on another phone or computer. Clearing site data, or using a private window, will erase it. To share the result, use <strong>Reports and Export</strong>.'],
    ['How do I share the settlement with my group?', 'Go to <strong>Reports and Export</strong>, then press <em>Copy summary</em> and paste it into any chat, or press <em>Open in WhatsApp</em>.'],
    ['How do I export or print the report?', '<em>Copy CSV</em> in Reports and Export copies the expense table, with one column per person, ready to paste into Excel or Google Sheets. To print, use your browser’s print command (Ctrl+P, or ⌘P on a Mac). Only the report is printed, and you can choose “Save as PDF” as the printer.'],
    ['Which currencies are supported?', 'Indian Rupee (default), US Dollar, Euro, British Pound, UAE Dirham, Singapore Dollar, Thai Baht, Australian Dollar and Japanese Yen.']

      if (!names.length) errs.push('Add at least one member.');
      if (errs.length) { ui.ntErrors = errs; render(true); return; }
      var nt = E.normalizeTrip({ id: 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name: f.name, start: f.start, end: f.end, location: f.location, currency: f.currency, members: [], expenses: [], payments: [], categories: [], counters: { m: 1, e: 1, p: 1 } });
      names.forEach(function (n) { nt.members.push({ id: nextId(nt, 'm'), name: n, active: true }); });
      S.trips.push(nt); S.activeTripId = nt.id;
      ui.nt = null; ui.ntErrors = []; ui.draft = null; ui.editingId = null; ui.filters = { q: '', member: '', category: '', from: '', to: '' }; ui.open = {};
      ui.lastPayer = ''; ui.lastCategory = ''; ui.lastDate = '';
      toast('Trip created. Add your first expense.'); persist(); go('add'); return;
    }
    if (kind === 'trip-details') {
      var errs2 = [], nm = String(fd.get('name') || '').trim(), st = fd.get('start') || '', en = fd.get('end') || '', cur = fd.get('currency');
      if (!nm) errs2.push('The trip needs a name.');
      if (st && en && en < st) errs2.push('The end date is before the start date.');
      if (cur !== t.currency && (t.expenses.length || t.payments.length) && E.CURRENCIES[cur].decimals !== E.CURRENCIES[t.currency].decimals) errs2.push('Amounts are stored in ' + (E.CURRENCIES[t.currency].decimals ? 'cents' : 'whole units') + ', so this trip can only switch to a currency that uses the same decimals.');
      if (errs2.length) { ui.tdErrors = errs2; render(true); return; }
      t.name = nm; t.start = st; t.end = en; t.location = String(fd.get('location') || '').trim(); t.currency = cur;
      ui.tdErrors = []; toast('Trip details saved.'); commit(true); return;
    }
    if (kind === 'add-member') {
      var n = String(fd.get('name') || '').trim();
      if (!n) { ui.memberErrors = ['Type a name to add.']; render(true); return; }
      if (t.members.some(function (m) { return m.name.toLowerCase() === n.toLowerCase(); })) { ui.memberErrors = ['There is already a member called ' + n + '. Use a nickname or surname to tell them apart.']; render(true); return; }
      ui.memberErrors = [];
      t.members.push({ id: nextId(t, 'm'), name: n, active: true });
      toast(n + ' added.'); commit(true);
      var nmEl = document.getElementById('newMember'); if (nmEl) nmEl.focus();
      return;
    }
    if (kind === 'rename') {
      var rn = String(fd.get('name') || '').trim();
      var clash = t.members.some(function (m) { return m.id !== ui.renameId && m.name.toLowerCase() === rn.toLowerCase(); });
      if (!rn || clash) { toast(!rn ? 'The name can’t be empty.' : 'Another member already has that name.'); return; }
      t.members.filter(function (m) { return m.id === ui.renameId; })[0].name = rn;
      ui.renameId = null; toast('Name updated everywhere.'); commit(true); return;
    }
    if (kind === 'record-pay') {
      var from = fd.get('from'), to = fd.get('to');
      var chk = parsePayment(t, F, from, to, fd.get('amount'));
      if (chk.errs.length) { ui.payErrors = chk.errs; render(true); window.scrollTo(0, 0); return; }
      t.payments.push({ id: nextId(t, 'p'), from: from, to: to, amount: chk.amount, date: todayISO() });
      ui.payErrors = []; ui.payForm = null;
      toast('Payment recorded: ' + nameOf(t, from) + ' → ' + nameOf(t, to) + ' ' + F.money(chk.amount)); commit(true); return;
    }
    if (kind === 'edit-pay') {
      var pid = fd.get('id');
      var amt = E.parseMoney(fd.get('amount'), F.decimals);
      if (!amt) { toast('Enter an amount greater than zero.'); return; }
      t.payments.filter(function (p) { return p.id === pid; })[0].amount = amt;
      ui.editPay = null; toast('Payment corrected. Balances updated.'); commit(true); return;
    }
  });

  app.addEventListener('input', function (ev) {
    var el = ev.target, t = T();
    if (el.dataset.d !== undefined && ui.draft) {
      var k = el.dataset.d;
      if (k === 'category' && el.value === '__new') { ui.addingCat = true; render(true); var nc = document.getElementById('newCat'); if (nc) nc.focus(); return; }
      ui.draft[k] = el.value;
      if (k === 'amountStr') refreshPreview();
    } else if (el.dataset.cust !== undefined && ui.draft) {
      ui.draft.custom[el.dataset.cust] = el.value; refreshPreview();
    } else if (el.dataset.f !== undefined) {
      ui.filters[el.dataset.f] = el.value; renderHistoryList();
    }
  });

  app.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.id === 'tripSel') {
      S.activeTripId = el.value; ui.draft = null; ui.editingId = null; ui.open = {}; ui.confirmTrip = false;
      ui.filters = { q: '', member: '', category: '', from: '', to: '' }; ui.lastPayer = ''; ui.lastCategory = ''; ui.lastDate = '';
      persist(); go('dashboard'); return;
    }
    if (el.dataset.part !== undefined && ui.draft) {
      var id = el.dataset.part, i = ui.draft.participants.indexOf(id);
      if (el.checked && i < 0) ui.draft.participants.push(id);
      if (!el.checked && i >= 0) ui.draft.participants.splice(i, 1);
      render(true);
    }
  });

  if (ui.view === 'newtrip' && !T()) ui.nt = null;
  render();
})();
</script>

</body></html>
